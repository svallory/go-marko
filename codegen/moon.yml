# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  test:
    command: "bun"
    args: ["test"]
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "package.json"
      - "bun.lock"

  generate-examples:
    script: |
      bun src/cli.mjs generate ../examples/hello
      bun src/cli.mjs generate ../examples/counter
    inputs:
      - "src/**/*"
      - "/examples/hello/**/*.marko"
      - "/examples/counter/**/*.marko"
    outputs:
      - "/examples/hello/**/*.go"
      - "/examples/counter/**/*.go"
    options:
      cache: false

  # Lockstep version gate: codegen/package.json, the version marker codegen
  # emits, and the sentinel runtime/version.go exports must all agree. See
  # scripts/release-check.mjs and runtime/version.go.
  release-check:
    command: "bun"
    args: ["../scripts/release-check.mjs"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "/runtime/version.go"
      - "/scripts/release-check.mjs"

  # Aggregate entry point run by CI: `moon run :check`.
  check:
    command: "echo"
    args: "codegen checks passed"
    deps:
      - "test"
      - "generate-examples"
      - "release-check"
