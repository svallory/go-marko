# https://moonrepo.dev/docs/config/workspace
$schema: "https://moonrepo.dev/schemas/workspace.json"

# Project registry: the npm package (packages/marko-go/), the root Go
# module ("."), and the docmd docs site (docs/).
projects:
  marko-go: "packages/marko-go"
  gomod: "."
  docs: "docs"

vcs:
  defaultBranch: "main"
  provider: "github"
