# https://moonrepo.dev/docs/config/workspace
$schema: "https://moonrepo.dev/schemas/workspace.json"

# Project registry: the npm package (codegen/), the root Go module ("."),
# and the docmd docs site (docs/).
projects:
  codegen: "codegen"
  gomod: "."
  docs: "docs"

vcs:
  defaultBranch: "main"
  provider: "github"
