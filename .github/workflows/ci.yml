name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup proto & moon toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Run checks (bun test, go vet, go test, build)
        run: moon run :check

      - name: Fail if generated examples drifted
        run: git diff --exit-code examples/

      - name: Check codegen/runtime lockstep version
        run: bun scripts/release-check.mjs
